# Deploys site/ with GitHub Actions Pages.
# Enabling Pages requires a repository setting. On 28 Oct 2026,
# POST /repos/sanoojcools/pa-evidence-lab/pages returned 403
# "Resource not accessible by integration", and has_pages was false.
# This workflow runs only after a push to the default branch.
# It is not triggered from the draft pull request, and the branch is not merged to work around that.

name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
